name: Generer les vignettes

# Se declenche quand des images changent dans contenu/ sur la branche img,
# ou a la main (onglet Actions > Generer les vignettes > Run workflow).
on:
  push:
    branches: [img]
    paths:
      - 'contenu/**.jpg'
      - 'contenu/**.jpeg'
      - 'contenu/**.png'
      - 'contenu/**.webp'
      - '!contenu/thumb/**'      # on ignore le dossier des vignettes...
  workflow_dispatch:

# Autorise l'Action a ecrire dans le depot (sinon elle ne peut rien pousser).
permissions:
  contents: write

# Une seule execution a la fois. Quand l'outil d'ajout envoie 10 images d'affilee, GitHub
# annule les executions en attente : ce n'est pas grave, car chaque execution traite
# TOUTES les images qui n'ont pas encore de vignette (pas seulement celles du dernier envoi).
concurrency:
  group: thumbs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest

    # Garde anti-boucle : si le commit vient de l'Action elle-meme
    # (message contenant [skip-thumbs]), on ne relance pas.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip-thumbs]') }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          ref: img

      - name: Installer Python et Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow

      - name: Lister les images sans vignette
        run: |
          # Toutes les images de contenu/ dont contenu/thumb/<nom>.webp n'existe pas encore.
          : > /tmp/manquantes.txt
          for f in contenu/*.jpg contenu/*.jpeg contenu/*.png contenu/*.webp; do
            [ -f "$f" ] || continue
            nom=$(basename "$f"); nom="${nom%.*}"
            [ -f "contenu/thumb/$nom.webp" ] || echo "$f" >> /tmp/manquantes.txt
          done
          echo "Images sans vignette :"
          cat /tmp/manquantes.txt

      - name: Generer les vignettes
        run: |
          if [ -s /tmp/manquantes.txt ]; then
            # xargs -d '\n' : un fichier par ligne, gere les espaces dans les noms.
            xargs -d '\n' python make_thumbs_ci.py < /tmp/manquantes.txt
          else
            echo "Aucune vignette a generer."
          fi

      - name: Commiter les vignettes generees
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contenu/thumb
          if git diff --cached --quiet; then
            echo "Aucune vignette a commiter."
            exit 0
          fi
          git commit -m "Vignettes automatiques [skip-thumbs]"
          # Si l'outil d'ajout a envoye une image pendant ce temps, on se remet a jour et on reessaie
          for essai in 1 2 3 4 5; do
            git pull --rebase origin img && git push && exit 0
            sleep 5
          done
          exit 1
